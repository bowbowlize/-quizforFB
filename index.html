<script>
window.spqCq=0;
window.spqSc={};
window.spqQs=[
  {q:"感受一下，你感覺到的那種「累」，通常是哪一種質感？",opts:[
    {t:"渴望被看見卻不知道展示什麼，覺得自己沒有值得被注意的地方。",p:1,s:1},
    {t:"睡再久都補不回來，那種空洞不是身體的問題。",p:2,s:1},
    {t:"世界褪成灰色，對本來喜歡的東西完全提不起勁。",p:4,s:1},
    {t:"肩膀重得像扛了一座山，完全不敢鬆懈。",p:7,s:1},
    {t:"像機器沒電、全身痠痛，但最重的是那種說不出口的無力感。",p:10,s:1}
  ]},
  {q:"在獲得成就或稱讚時，你內心的第一反應是？",opts:[
    {t:"虛軟的恐慌感。覺得自己只是運氣好，擔心下次就會被拆穿。",p:1,s:1},
    {t:"說不出口的空洞感。有想法，但不知道怎麼讓人真的聽進去。",p:3,s:1},
    {t:"彆扭的抗拒感。很開心但不敢表現，覺得自己不配擁有這麼亮的時刻。",p:5,s:1},
    {t:"飄渺的空虛感。覺得「就這樣嗎？」，這個成就跟我想要的好像差很遠。",p:6,s:1},
    {t:"莫名的壓迫感。覺得自己應該做不一樣的事，但又說不清楚是什麼。",p:8,s:1}
  ]},
  {q:"夜深人靜獨處時，那股揮之不去的「不安」長什麼樣子？",opts:[
    {t:"莫名的委屈感。明明沒什麼大事，卻突然很想哭，又不知道從何說起。",p:2,s:1},
    {t:"腦袋像關不掉的發電機，不斷反芻今天的錯誤或明天的漏洞。",p:3,s:1},
    {t:"覺得身後有個懸崖，只要我不努力前進，隨時會被現實拋棄。",p:7,s:1},
    {t:"覺得自己像個外星人，跟這世界隔著一層膜，沒人真正懂我。",p:9,s:1},
    {t:"覺得人生像一場已經知道結局的爛戲，只能認命演完。",p:10,s:1}
  ]},
  {q:"如果你突然擁有一週的空檔，你的靈魂會呈現什麼狀態？",opts:[
    {t:"對什麼都提不起勁。放假了，但那種灰色感沒有消失。",p:4,s:1},
    {t:"會進入「備戰式休息」。名義上在放假，實際上在規劃競爭或進修。",p:5,s:1},
    {t:"空洞的飄移感。不知道自己真正想做什麼，對什麼都無所謂。",p:6,s:1},
    {t:"比平常更焦躁。閒下來反而不舒服，覺得自己跟世界的節奏脫節了。",p:8,s:1},
    {t:"徹底斷電。那不是放鬆，是一種靈魂出竅般的麻木。",p:9,s:1}
  ]},
  {q:"面對真正高品質的享受（美食、旅行）時，你的反應是？",opts:[
    {t:"猶豫和自我懷疑。總覺得自己不配享受這麼好的東西。",p:4,s:1},
    {t:"無法享受的「旁觀感」。明明在場，卻覺得自己只是個觀察者。",p:3,s:1},
    {t:"彆扭的抗拒感。心裡很想要，嘴上卻說不用了、不重要。",p:1,s:1},
    {t:"嚴苛的審查員。買任何東西都要證明這很「划算」，否則不敢用。",p:7,s:1},
    {t:"贖罪式的消費。買完昂貴的東西後，會縮衣節食當作懲罰。",p:10,s:1}
  ]},
  {q:"當你遇到不公平或被冒犯時，你的情緒流向是？",opts:[
    {t:"往內反彈。喉嚨緊緊的說不出話，回家後才在腦海裡練習反擊。",p:3,s:1},
    {t:"瞬間爆發。但講出來的話往往傷人傷己，最後變成自我厭惡。",p:5,s:1},
    {t:"冰冷隔絕。用一種「你這種人不配我生氣」的高傲，切斷感受。",p:7,s:1},
    {t:"壓抑的怪異感。明明想做一件很不一樣的事，卻硬把自己拉回來。",p:8,s:1},
    {t:"身體代償。情緒還沒出來，偏頭痛、胃痛或過敏就先發作。",p:9,s:1}
  ]},
  {q:"在一段關係中如果你感覺到「失控」了，你的反應是？",opts:[
    {t:"崩潰式的消失。不是生氣，就是突然很想把自己從所有人的視線裡移除。",p:1,s:1},
    {t:"變得很卑微，試圖透過「加倍付出」來挽回局面。",p:2,s:1},
    {t:"喉嚨緊緊的說不出話，把所有委屈都吞進去，假裝沒事。",p:3,s:1},
    {t:"開始幻想完全不同的生活。如果我消失，換一個地方重新開始會怎樣。",p:6,s:1},
    {t:"變得極具攻擊性，或透過讓對方愧疚來重新主導局面。",p:10,s:1}
  ]},
  {q:"你發現自己最常陷入哪種重複的關係模式？",opts:[
    {t:"專找讓我覺得不夠美、不夠好的關係，然後拚命想證明自己。",p:4,s:1},
    {t:"專找「受難者」。那些看起來很慘、需要被拯救的靈魂。",p:5,s:1},
    {t:"專找「權威者」。那些能給你方向，卻又否定你的人。",p:7,s:1},
    {t:"專找「異類」。那些跟主流格格不入的人，讓你覺得被理解。",p:8,s:1},
    {t:"專找「無法觸及的人」。讓你活在幻想中，逃避現實。",p:9,s:1}
  ]},
  {q:"感受你的「喉嚨」與「胸口」，不適感通常何時出現？",opts:[
    {t:"當我感覺到付出了很多，卻根本沒人看見我的委屈時。",p:2,s:1},
    {t:"當我要說出自己的想法，卻擔心說錯或說了沒用的時候。",p:3,s:1},
    {t:"當我感覺到自己只是在原地打轉，看不到任何突破的時候。",p:6,s:1},
    {t:"當我感覺到環境中有毒、有負能量，想逃卻逃不掉時。",p:9,s:1},
    {t:"當我面對一個重要決定，卻完全不知道自己要什麼的時候。",p:10,s:1}
  ]},
  {q:"關於「融入世界」，你最常有的感覺是？",opts:[
    {t:"覺得這世界很陌生。我不知道自己在哪裡、要往哪裡走。",p:1,s:1},
    {t:"覺得這世界很無聊。什麼都試過了，什麼都提不起真正的興趣。",p:4,s:1},
    {t:"覺得這世界太小。我知道有更大的可能，但就是到不了那裡。",p:6,s:1},
    {t:"覺得這世界很假。自己像是來地球「出差」的觀察者。",p:8,s:1},
    {t:"覺得這世界很危險。隨時想把手機關機、斷開所有聯絡。",p:10,s:1}
  ]},
  {q:"你的「想法」與「實踐」之間，通常隔著什麼？",opts:[
    {t:"隔著「情緒的重量」。還沒開始就先被一股說不清楚的難過壓住了。",p:2,s:1},
    {t:"隔著「自我審查」。覺得想法不夠完美，怕拿出來被笑。",p:3,s:1},
    {t:"隔著「生理疲憊」。我明明很想衝，但身體根本沒力氣。",p:5,s:1},
    {t:"隔著「責任感」。我光是把現有的事做完就沒力氣了，哪有空想別的。",p:7,s:1},
    {t:"隔著「方向的迷霧」。我有很多想法，但不知道哪個才是真正值得追的。",p:9,s:1}
  ]},
  {q:"對你而言，金錢在生活中主要扮演的角色是？",opts:[
    {t:"認同感的「武裝衣」。透過擁有某些東西，讓自己看起來有價值。",p:1,s:1},
    {t:"讓生活美一點的工具。但我一直覺得自己不配把錢花在享受上。",p:4,s:1},
    {t:"讓夢想有一天能實現的底氣。但我好像一直在「準備」，從來沒真的開始。",p:6,s:1},
    {t:"安全感的「護城河」。存款數字就是救命稻草，少了會很恐慌。",p:7,s:1},
    {t:"打破規則的籌碼。我想用錢換到不用照別人方式活的自由。",p:8,s:1}
  ]},
  {q:"你現在身上最沈重的枷鎖，源自哪種感覺？",opts:[
    {t:"對父母或重要他人的「補償感」。想活出自己，又覺得背叛了他們的期待。",p:2,s:1},
    {t:"對「說清楚」的恐懼感。我怕說出來之後，別人還是不懂，那種感覺更寂寞。",p:3,s:1},
    {t:"對「輸」的恐懼感。我怕真的去做，結果還是失敗，那就什麼都沒了。",p:5,s:1},
    {t:"對「不一樣」的恐懼感。我怕脫隊之後，沒有人等我。",p:8,s:1},
    {t:"對毀滅的焦慮感。總覺得好日子隨時會結束，所以不敢真的放鬆。",p:10,s:1}
  ]},
  {q:"如果要徹底結束一段關係，你心底最怕的是？",opts:[
    {t:"「評價」。萬一失敗了，別人怎麼看我，我怎麼看自己。",p:1,s:1},
    {t:"「空洞」。結束之後，那個陪伴我的感覺消失了，我不知道能不能填回來。",p:4,s:1},
    {t:"「年紀」。覺得太老了、沒機會了，只能認命待著。",p:6,s:1},
    {t:"「愧疚」。萬一我走了，對方（或公司）沒有我會崩潰。",p:7,s:1},
    {t:"「未知」。我怕離開了地獄，外面是更慘的地獄。",p:9,s:1}
  ]},
  {q:"最後的直覺：你覺得你現在的人生處於什麼狀態？",opts:[
    {t:"像是一直在「等被看見」。我覺得我有東西，但沒人發現。",p:2,s:1},
    {t:"像是一直在「想說什麼」，但每次開口都覺得說不到重點。",p:3,s:1},
    {t:"像是一場「長跑」。我根本不知道終點在哪，只是一直在跑。",p:5,s:1},
    {t:"系統已經「當機」。我現在只想按鍵重啟，什麼都不管了。",p:9,s:1},
    {t:"像是一直在「認命」。我知道有些事不對，但就是動不了。",p:10,s:1}
  ]},
  {q:"最後一題，直覺就好：如果你的靈魂現在是一種動物，最像哪一個？",opts:[
    {t:"變色龍。",p:1,s:2},
    {t:"受傷的貓。",p:2,s:2},
    {t:"關在籠子裡的鸚鵡。",p:3,s:2},
    {t:"枯萎的花。",p:4,s:2},
    {t:"被困住的獅子。",p:5,s:2},
    {t:"冬眠的熊。",p:6,s:2},
    {t:"老黃牛。",p:7,s:2},
    {t:"籠中的異色鳥。",p:8,s:2},
    {t:"深海魚。",p:9,s:2},
    {t:"蛻皮中的蛇。",p:10,s:2}
  ]}
];
window.spqRs={
  1:{name:"☉ 太陽",sub:"消失的發光體",arch:"太陽在占星裡代表我們想要活出的樣子——那個最真實、最有生命力的自己。被太陽扣押能量的人，那個「我想要什麼」的聲音從很早就被打壓、被否定，久了就真的不知道自己要什麼了。然後開始學別人，跟著別人的答案過自己的人生。",karma:"你的能量被扣押在「我不知道自己是誰」這個問題裡。你的想法從來沒有被好好接納過——說出來被否定，表現出來被打壓，久了你就學會先把自己藏起來，再去看別人怎麼做。人云亦云不是你的個性，是你的保護機制。",body:"能量住在心臟與背部。你不敢挺直腰桿做自己，總覺得有人在評判你。容易有心悸、或莫名的疲憊感——那是太陽能量被壓住、無法向外發光的物理反應。",real:"明明有能力，卻總在關鍵時刻退縮，把機會讓給別人。容易跟著別人的意見走，事後才後悔。不是沒有品味，是不敢相信自己的品味算數。",title:"太陽的功課是找回「我想要什麼」這個答案",steps:["從最小的選擇開始練習有自己的答案。今天午餐吃什麼、週末想做什麼——不問別人，先問自己。太陽能量的回流從這些微小的「我決定」開始累積。","回想一件你曾經因為被否定而放棄的事，不需要馬上重新去做，只是允許自己承認：「我那時候其實很想要那個。」光是這個承認，就是在把能量還給自己。","太陽走完功課的人，會變得很有自信、很樂觀——真的清楚自己是誰、想要什麼，不需要別人的答案來定義自己。"]},
  2:{name:"☽ 月亮",sub:"飢餓的靈魂孤兒",arch:"月亮在占星裡管的是情緒、內在小孩、還有你最深的安全感需求。它是你在沒有人看的時候真正的樣子。被月亮扣押能量的人，過去的創傷還住在身體裡，用一種你以為已經沒事的方式，繼續影響你現在的每一個反應。",karma:"你的能量被扣押在過去的傷裡。那些傷不一定是大事，有時候只是某種一直沒被接納的感覺、一直沒被看見的需求。現在的你是驚弓之鳥——你的神經系統還在用過去的劇本判斷現在的處境。",body:"能量住在胸口與胃部。壓力一來就想吃東西、或完全吃不下，消化系統容易出問題。睡前那種莫名的心酸，找不到原因但就是不舒服，那是你的內在狀況一直被你忽視，所以需要用身體去提醒你。",real:"你在關係裡容易過度付出、或突然消失，兩個極端都有可能。你渴望被理解，卻又覺得沒有人真的懂你——你習慣把最真實的部分藏起來保護自己。",title:"月亮的功課是回去接納那個還在等的內在小孩",steps:["下次你有一個「說不清楚為什麼」的情緒反應時，不要急著分析它或壓下去。先問：「這個感覺幾歲？」月亮的創傷通常有一個很具體的年紀。","找出一件你以前沒有得到過、但現在可以給自己的事——不用很大，可以只是一個讓自己覺得被照顧的小習慣。月亮的解封從你開始知道怎麼滋養自己開始。","月亮走完功課的人，會對自己很溫柔，也知道怎麼對自己好又不傷害別人。真的有能力照顧自己之後，才長出來的東西。"]},
  3:{name:"☿ 水星",sub:"封閉的傳遞者",arch:"水星在占星裡管的是思維、溝通、還有你怎麼理解這個世界。被水星扣押能量的人，因為思維不夠彈性，有話就說不出來了，說了也擔心沒用，於是慢慢習慣把話吞回去。久了連自己都不確定自己在想什麼。",karma:"你的能量被扣押在「說了也沒用」和「說錯了怎麼辦」這兩個聲音之間。你太早就學到表達是有風險的事。思維就這樣卡關，轉不動，每次想換個角度看事情，都覺得很費力。",body:"能量住在呼吸道與肩膀。呼吸習慣性地淺，說話前會先清喉嚨，頸部有無名的痠痛。話沒說出去，能量就堵在那裡。",real:"總覺得跟周圍的人「能量不對」，話說出去沒有回聲。常常在別人說出你早就想到的東西時，心裡閃過「我早就知道了」，然後又快速壓下去。",title:"水星的功課是讓思維重新流動起來",steps:["找一個你完全不認識的地方說一件真話——匿名留言、寫一封不寄出的信都好。門檻最低的地方，往往是能量最容易開始流動的地方。","每天寫三句話，不用完整，不用漂亮。只是讓思想從腦袋移動到外部世界，這個動作本身就是水星能量的流通練習。","水星走完功課的人，會很容易轉念，彈性接受各種變化，價值觀也會跟著鬆動——立場穩，只是真的看得更廣了。"]},
  4:{name:"♀ 金星",sub:"乾枯的美感囚徒",arch:"金星在占星裡代表美、魅力、還有你跟愉悅之間的關係。被金星扣押能量的人，對美的感受力突然消失了——世界像是褪成灰色，對那些本來喜歡的東西提不起勁，那種喜悅的能量找不到了。",karma:"你的能量被扣押在一種乾枯感裡。和土星的沉重不太一樣，是一種對生活的美和喜悅毫無感覺的狀態。你知道那些東西應該很好，但就是碰不到那個感受。",body:"能量住在腎臟與腰部。腰部痠軟無力，社交場合容易疲憊。這個能量被封住，身體就會用痠軟和無力告訴你，你已經很久沒有真正被滋養了。",real:"容易覺得生活是灰色的，對美食、旅行、喜歡的事物都提不起興趣。對自己的魅力沒有感覺，也不確定自己想要什麼樣的關係或生活。",title:"金星的功課是重新找回對美的感受力",steps:["找一件你以前很喜歡、但很久沒做的事，不管多小——可能是聽某首歌、去某個地方、吃某個東西。不用期待立刻有感覺，就是讓自己靠近它。","刻意去觀察一個你覺得美的東西，停在那裡超過三分鐘。金星的能量需要你真的停下來，讓美的能量有時間進來。","金星走完功課的人，會變得很有魅力、很清楚自己要什麼，跟她相處起來也很舒服。那種魅力從裡面重新長出來的。"]},
  5:{name:"♂ 火星",sub:"斷電的戰士",arch:"火星在占星裡是行動、意志、還有你敢不敢為自己出手的力量。被火星扣押能量的人，僵住了——前面有太多障礙，失敗過太多次，或者根本還沒開始就先在腦袋裡把自己否決掉了。",karma:"你的能量被扣押在對失敗的恐懼裡。你太清楚輸的感覺，所以寧願不動也不要再輸一次。加上路上障礙太多，慢慢地那個「我要」的聲音就越來越小，最後你連自己想要什麼都不確定了。",body:"能量住在頭部與肌肉。偏頭痛、眼壓高、莫名的身體緊繃——那是行動力沒有出口，在身體裡找地方宣洩。火星的能量本來是要向外推進的，被壓住之後不會消失，會轉向攻擊你自己的身體。",real:"臨門一腳總是出錯，或在快要成功的時候莫名退縮。生活裡缺乏真正讓你興奮的事，每天像在走一個沒有高潮的劇本。",title:"火星的功課是學會帶著失敗的可能性還是動起來",steps:["找出你現在最卡關的那件事。先誠實承認「我卡在這裡，我不知道怎麼動」。火星的能量從誠實開始——假裝沒卡關只會讓它卡得更死。","做一件你會失敗但沒關係的小事。讓身體記住「我失敗了，但我還在」。火星型的人對失敗的恐懼通常比實際的失敗還要大很多。","火星走完功課的人，知道自己會怕、知道可能會輸，還是決定往前走。那個打開的機會，是真的因為動了才出現的，不是等來的。"]},
  6:{name:"♃ 木星",sub:"踩空的樂觀者",arch:"木星在占星裡代表對未來的希望、擴展、還有那個想要往更大更好的地方走的衝動。被木星扣押能量的人，那個火從來就點不起來，只顧著眼前的利益，覺得得過且過就好了，對更深度的生活提不起興趣。",karma:"你的能量被扣押在「就這樣吧」的慣性裡。那個想要更多、想要不一樣的聲音一直被眼前的事情蓋住。久了你就習慣活在當下的小格局裡，因為沒有人告訴你你可以要更多。",body:"能量住在肝臟與消化系統。容易疲累、代謝差，睡多少都覺得補不夠。木星的能量是擴張的——這個能量被壓住，身體就會用一種說不清楚的沉滯感告訴你，你的靈魂其實想要更大的空間。",real:"容易被眼前的小利益綁住，看不到更遠的可能性。生活平穩但缺乏真正的目標感，有時候會突然覺得「就這樣嗎」，但又不知道要往哪裡走。",title:"木星的功課是讓靈魂開始想像更大的可能",steps:["問自己一個你從來不敢認真回答的問題：「如果我不用考慮現實，我想要什麼樣的生活？」不用馬上行動，先讓這個問題存在。木星的能量從允許自己想像開始。","找一件比你現在做的事「大一個層次」的事去嘗試——讓身體開始感受「更大」是什麼感覺。","木星走完功課的人，會開始勇於追求更有深度的生活模式。真的知道自己值得活得更有意義。"]},
  7:{name:"♄ 土星",sub:"靈魂的超載苦行僧",arch:"土星在占星裡是最嚴厲的老師。它不給你答案，它讓你撞牆，讓你痛，讓你在痛裡面自己想清楚。土星管的是業力、是結構、是這輩子你必須正面交鋒的功課。被土星扣押能量的人，靈魂深處有一個設定：禮物要用痛苦換。不付出，不配得到。",karma:"你的能量被扣押在「付出才有禮物」這個靈魂信念裡。你從很早就學到，輕鬆得來的東西不算數，快樂要先被允許才能有。所以你不放手、從不喊累，然後發現付出被當成理所當然，甚至被當垃圾。土星型的人走這條路，是因為靈魂合約裡就寫著這一關非過不可。",body:"能量住在骨骼、脊椎與皮膚。脊椎僵硬、肩頸像背著山，容易關節痛或皮膚反覆出狀況。當你把太多責任壓在身上，身體的結構就先替你承接那個重量。你的骨頭在說一件你嘴巴不肯說的事：太重了。",real:"你是所有人的守護神，卻沒人問你累不累。你身邊容易出現只拿不還的關係或工作環境。你不相信錢可以輕鬆進來，如果進來得太容易，你反而懷疑哪裡有問題。",title:"土星的功課不是更努力，是學會禮物不用痛苦換",steps:["找出你現在正在執著的一件事，問自己：「我在等什麼？等誰來看見我？等什麼時候才算夠？」土星型的人很少問這個，因為問了會難過。但難過是能量開始鬆動的訊號，不是壞事。","練習接受一件不用付出就來的好事，不要找理由解釋它為什麼「不算」。土星的解封從打破「輕鬆不合法」這個信念開始。","土星走完功課的人，會變成真正有智慧的人——看過痛苦、卻不再用痛苦證明自己。那個狀態才是土星給你的禮物。"]},
  8:{name:"♅ 天王星",sub:"異類的孤獨者",arch:"天王星在占星裡代表革命、突破、還有那個不想跟別人一樣的衝動。被天王星扣押能量的人，被環境、被傳統、被「應該要這樣」的壓力壓回去了，變得守舊、變得傳統，活在一個不像自己的框架裡，有時候連自己都不知道其實想要不一樣。",karma:"你的能量被扣押在「不敢不一樣」這件事裡。可能是怕出頭、可能是被環境壓回去、也可能是根本還沒意識到自己其實渴望改變。你表面上守規矩，但內心偶爾會冒出一種莫名的躁動，不知道那是什麼。那就是天王星在敲門。",body:"能量住在神經系統與循環。莫名的抽筋、心律不整，或情緒突然失控。天王星的能量太強，卻找不到接地點——身體一直在嘗試釋放那些沒有出口的、想要不一樣的能量。",real:"生活很穩定，但偶爾會突然覺得悶、覺得這不是自己想要的。對改變既渴望又害怕，想要不一樣卻不知道要從哪裡開始動。",title:"天王星的功課是允許自己開始不一樣",steps:["找出一件你一直「應該這樣做但其實很不想」的事，問自己：如果不這樣做，最壞的結果是什麼？天王星的解封從打破一個小慣例開始，先從一件小事鬆手。","做一件你覺得「有點奇怪、不太像我平常會做的事」——就是讓自己嘗試一個不一樣的版本的自己。","天王星走完功課的人，會真的去做改變。因為終於知道自己想要什麼樣的生活，然後有勇氣往那個方向走。"]},
  9:{name:"♆ 海王星",sub:"溺水的靈性流浪者",arch:"海王星在占星裡代表夢幻、想像力、還有對無形世界的感知。被海王星扣押能量的人，對那些無形的東西——直覺、靈性感知、對夢想和美的嚮往——全部都關掉了，覺得那些都沒什麼意義，只顧著眼前看得到的東西。",karma:"你的能量被扣押在一種對無形世界毫無在意的狀態裡。海王星的能量被封住了，你的直覺、你的想像力、你對某些事情會有的那種「感覺到了」——都變得很微弱，甚至完全感受不到。",body:"能量住在免疫系統與淋巴。睡再久都補不回來的累，容易過敏、或免疫系統不穩。你的能量場像一個沒有蓋子的罐子，才華和感知力都在漏，卻找不到原因。",real:"對夢想和長遠的目標提不起勁，覺得想那些太虛了。直覺不靈，對很多事情感受不到什麼，生活變得很平、很實際，但也缺少了什麼說不清楚的東西。",title:"海王星的功課是重新打開對無形世界的感知",steps:["找回一個你以前有過、但現在已經很少去的夢想或嚮往，不用計畫怎麼實現，只是讓自己重新去想它。海王星的能量從允許自己做夢開始。","練習相信一次你的直覺——可以從小事開始，今天有個感覺，就跟著它走，看看結果怎樣。海王星的解封需要你給直覺一個被驗證的機會。","海王星走完功課的人，會變得很容易覺得事情會成功——真的跟無形的世界重新連上線之後，那種篤定自然就回來了。"]},
  10:{name:"♇ 冥王星",sub:"灼傷的重生戰士",arch:"冥王星在占星裡代表審判、強烈、還有那種必須死去一次才能重生的蛻變。被冥王星扣押能量的人，往往陷在一種習得性無助的狀態裡——已經被打到不相信自己有能力做決定，連重要的選擇都不敢碰，因為怕又錯、又要承擔後果。",karma:"你的能量被扣押在「我做了也沒用」這個深層信念裡。你在某些時刻被打到覺得自己的決定不算數，或者決定了也會出錯。於是你開始迴避那些重要的選擇，讓時間替你決定，讓別人替你決定。",body:"能量住在生殖系統與心臟。容易有無名火、情緒突然崩潰、或長期壓抑後的爆發。冥王星的強度沒有消失，只是轉向——開始攻擊你自己的身體，替你承接那些你說「沒事」的時刻。",real:"面對重要的人生選擇時會無限拖延，或交給別人決定。關係模式容易走極端，沒有中間地帶。隱約知道有些事需要改變，但就是遲遲無法動手。",title:"冥王星的功課是重新相信自己有能力做決定",steps:["找出一件你已經拖很久的決定，不需要馬上做，先問自己：「我真正想要的結果是什麼？」冥王星的解封從搞清楚自己要什麼開始。","做一個小的、可逆的決定，然後承擔它的結果——不管結果好不好。讓身體記住「我決定了，我還在」這個感覺。冥王星型的人需要重新累積對自己決策能力的信任。","冥王星走完功課的人，會變得勇於壯士斷腕——真的清楚什麼該留、什麼該放，然後有能力做那個決定，不再讓恐懼替自己選擇。"]}
};
function spqGo(id){['spq-land','spq-quiz','spq-email','spq-result'].forEach(function(sid){var el=document.getElementById(sid);el.classList.remove('on');el.classList.add('sc');});var el=document.getElementById(id);el.classList.remove('sc');el.classList.add('on');}
function spqStart(){spqGo('spq-quiz');spqRq();}
function spqRq(){
  var total=window.spqQs.length;
  var q=window.spqQs[window.spqCq];
  document.getElementById('spq-prog').style.width=(window.spqCq/total*100)+'%';
  document.getElementById('spq-qn').textContent='問題 '+(window.spqCq+1)+' / '+total;
  document.getElementById('spq-qt').textContent=q.q;
  var el=document.getElementById('spq-opts');
  el.innerHTML='';
  q.opts.forEach(function(o){
    var b=document.createElement('button');
    b.className='ob';
    b.textContent=o.t;
    b.onclick=function(){
      document.querySelectorAll('.ob').forEach(function(x){x.classList.remove('sel');});
      b.classList.add('sel');
      setTimeout(function(){
        window.spqSc[o.p]=(window.spqSc[o.p]||0)+o.s;
        window.spqCq++;
        if(window.spqCq>=total){spqResult();}
        else{spqRq();}
      },350);
    };
    el.appendChild(b);
  });
}
function spqResult(){
  var top=7,max=0;
  Object.keys(window.spqSc).forEach(function(p){if(window.spqSc[p]>max){max=window.spqSc[p];top=parseInt(p);}});
  var r=window.spqRs[top];
  document.getElementById('spq-rname').textContent=r.name;
  document.getElementById('spq-rsub').textContent=r.sub;
  document.getElementById('spq-rarch').textContent=r.arch;
  document.getElementById('spq-rkarm').textContent=r.karma;
  document.getElementById('spq-rbody').textContent=r.body;
  document.getElementById('spq-rreal').textContent=r.real;
  document.getElementById('spq-rtitle').textContent=r.title;
  var el=document.getElementById('spq-rsteps');
  el.innerHTML='';
  r.steps.forEach(function(s,i){
    var d=document.createElement('div');
    d.className='step';
    d.innerHTML='<div class="snum">'+(i+1)+'</div><div class="stxt">'+s+'</div>';
    el.appendChild(d);
  });
  spqGo('spq-result');
}
function spqReset(){window.spqCq=0;window.spqSc={};spqGo('spq-land');}
</script>
